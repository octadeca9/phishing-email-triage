services:
  lab:
    build:
      context: ./runtime
      dockerfile: Dockerfile
    image: redlimit/phishing-email-triage-lab:1.0
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /home/lab:rw,noexec,nosuid,size=16m
    volumes:
      - ./data:/data:ro
    working_dir: /workspace
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    # Serves the browser terminal (ttyd) on 7681. On the default (non-internal)
    # network so the platform's web proxy can route to it. Egress restriction is
    # the platform's network-policy job in production, not Compose's.
    expose: ["7681"]
    environment:
      - PORT=7681
    networks: [lab_web]
    restart: unless-stopped

  validator:
    # DEV / REFERENCE ONLY. In production, scoring and the answer key live in the
    # platform (hack.redlimit.id) — NOT here. This service is behind the "dev"
    # profile so a plain `docker compose up` (e.g. on the deploy host) starts only
    # the participant `lab` and never tries to mount the private answer-key secret.
    # Run it locally with: docker compose --profile dev up
    profiles: ["dev"]
    build:
      context: ./validator
      dockerfile: Dockerfile
    image: redlimit/phishing-email-triage-validator:1.0
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    expose: ["8080"]
    networks: [lab_internal]
    restart: "no"
    # Development only; never mount this secret into the participant runtime.
    secrets: [answer_key]

networks:
  # Participant web terminal: reachable by the platform's ingress proxy.
  lab_web:
    driver: bridge
  # Validator stays on an internal-only network (dev profile; no host/web reach).
  lab_internal:
    internal: true

secrets:
  answer_key:
    file: ./validator/answer_key.private.json
